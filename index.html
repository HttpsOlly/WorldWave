<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorldWave Radio</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><circle cx='256' cy='256' r='240' fill='%23ec4899'/><path fill='%23334155' d='M256 16 a240 240 0 0 0 0 480 a120 120 0 0 0 0 -240 a120 120 0 0 1 0 -240 Z'/><circle cx='256' cy='136' r='36' fill='%23ec4899'/><circle cx='256' cy='376' r='36' fill='%23334155'/></svg>">



<script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-950 text-white font-sans h-screen flex flex-col overflow-hidden">

  <header class="bg-slate-900 border-b border-slate-800 px-3 sm:px-6 py-2.5 sm:py-3 flex items-center justify-between shrink-0 z-20 gap-2">
  <div class="flex items-center space-x-2.5 shrink-0">
    <div class="bg-slate-900 p-1 rounded-xl shadow-lg shrink-0 flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10">
      <svg class="w-6 h-6 sm:w-7 sm:h-7" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <circle cx="256" cy="256" r="216" fill="#ec4899" stroke="white" stroke-width="28" />
        <path fill="#334155" d="M256 40 a216 216 0 0 0 0 432 a108 108 0 0 0 0 -216 a108 108 0 0 1 0 -216 Z" />
        <circle cx="256" cy="148" r="32" fill="#ec4899" />
        <circle cx="256" cy="364" r="32" fill="#334155" />
      </svg>
    </div>
    <div>
      <h1 class="font-bold text-base sm:text-lg tracking-wide text-white leading-tight">World<span class="text-pink-400">Wave</span></h1>
      <p class="text-[11px] sm:text-xs text-slate-400">Exploring the World's Music</p>
    </div>
    </div>
  </div>
  
  <div class="flex items-center space-x-2 flex-1 max-w-xs sm:max-w-md justify-end">

    <div class="relative w-full">
      <span class="absolute inset-y-0 left-0 flex items-center pl-2.5 sm:pl-3 pointer-events-none text-slate-400">
        <i class="fa-solid fa-search text-xs sm:text-sm"></i>
      </span>
      
      <!-- Mobile view only-->
      <input type="text" id="searchOnMobile" placeholder="Search..." 
             class="md:hidden w-full bg-slate-950 border border-slate-800 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-pink-500 transition-colors" />

      <!-- Desktop  view only -->
      <input type="text" id="searchOnDesktop" placeholder="Search Stations or Genres..." 
             class="hidden md:block w-full bg-slate-950 border border-slate-800 rounded-lg pl-10 pr-4 py-1.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-pink-500 transition-colors" />
    </div>

    <!-- Favourite Stations Button -->
    <button id="openfavouritesBtn" class="bg-slate-950 border border-slate-800 hover:border-pink-500/50 text-slate-300 hover:text-pink-400 px-2.5 py-1.5 sm:px-3.5 sm:py-1.5 rounded-lg text-xs sm:text-sm flex items-center space-x-1.5 transition-colors shrink-0">
      <i class="fa-solid fa-bookmark text-pink-400"></i>
      <span class="hidden sm:inline">Saved</span>
      <span id="favouritesCountBadge" class="bg-pink-500/20 text-pink-400 border border-pink-500/30 text-[10px] font-bold px-1.5 py-0.2 rounded-full">0</span>
    </button>
  </div>
</header>

  <div class="flex-1 flex relative overflow-hidden">
    <div id="mapContainer" class="flex-1 h-full z-10"></div>
  </div>

<footer class="bg-slate-900 border-t border-slate-800 px-4 py-3 flex flex-row items-center justify-between gap-3 shrink-0 z-20 shadow-2xl">
    
    <div class="flex items-center space-x-3 overflow-hidden flex-1 min-w-0">
      <div class="relative shrink-0">
        <div id="stationIconBox" class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center overflow-hidden shadow-inner">
          <i id="defaultIcon" class="fa-solid fa-radio text-lg sm:text-xl text-pink-400"></i>
          <div id="equalizerBars" class="hidden flex items-end space-x-1 h-5 sm:h-6 eq-paused">
            <div class="eq-bar bg-green-400"></div>
            <div class="eq-bar bg-yellow-400"></div>
            <div class="eq-bar bg-amber-500"></div>
            <div class="eq-bar bg-red-500"></div>
          </div>
        </div>
        <img id="flagImage" src="" alt="" class="absolute -bottom-1 -right-1 w-4 h-3 sm:w-5 sm:h-3.5 rounded object-cover border border-slate-700 hidden shadow-md bg-slate-900" />
      </div>

      <div class="overflow-hidden min-w-0">
        <div id="titleLabel" class="font-semibold text-xs sm:text-base text-slate-100 truncate">Select a station on the map</div>
        <div id="metaLabel" class="text-[11px] sm:text-xs text-slate-400 truncate">Global Stream Directory</div>
        <div id="statusLabel" class="text-[9px] text-pink-400 uppercase tracking-widest font-semibold truncate">Ready</div>
      </div>
    </div>

    <div class="flex items-center space-x-2 md:absolute md:left-1/2 md:-translate-x-1/2 shrink-0">
      <button id="playButton" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-400 hover:to-rose-400 text-white shadow-lg shadow-pink-500/25 flex items-center justify-center transition-transform hover:scale-105 shrink-0">
        <i class="fa-solid fa-play ml-0.5 text-xs sm:text-sm"></i>
      </button>
      <audio id="audioElement" crossorigin="anonymous" class="hidden"></audio>
    </div>

    <div class="flex items-center space-x-2 sm:space-x-4 shrink-0">
      <button id="favouriteToggleBtn" class="w-9 h-9 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-pink-400 border border-slate-700 flex items-center justify-center transition-colors shrink-0" title="Bookmark Station">
        <i class="fa-regular fa-bookmark text-sm"></i>
      </button>

      <div class="hidden md:flex items-center space-x-3 pl-2 border-l border-slate-800">
        <i class="fa-solid fa-volume-low text-slate-400 text-sm"></i>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" 
               class="w-24 accent-pink-500 bg-slate-800 rounded-lg cursor-pointer h-1.5" />
        <i class="fa-solid fa-volume-high text-slate-400 text-sm"></i>
      </div>
    </div>
  </footer>

  <!-- Favourite Stations -->
  <div id="favouritesModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xl max-h-[80vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-2.5">
          <div class="bg-pink-500/10 text-pink-400 p-1.5 rounded-lg border border-pink-500/20">
            <i class="fa-solid fa-bookmark text-sm"></i>
          </div>
          <h2 class="font-bold text-white text-base">Bookmarked Stations</h2>
        </div>
        <button id="closefavouritesModal" class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-800 transition-colors">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      
      <div id="favouritesListContainer" class="p-6 overflow-y-auto flex-1 space-y-3">
      </div>
    </div>
  </div>

  <!-- Saved Stations Modal -->
  <div id="favouritesModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xl max-h-[80vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-2.5">
          <div class="bg-pink-500/10 text-pink-400 p-1.5 rounded-lg border border-pink-500/20">
            <i class="fa-solid fa-bookmark text-sm"></i>
          </div>
          <h2 class="font-bold text-white text-base">Saved Radio Stations</h2>
        </div>
        <button id="closefavouritesModal" class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-800 transition-colors">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      
      <div id="favouritesListContainer" class="p-6 overflow-y-auto flex-1 space-y-3">
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
